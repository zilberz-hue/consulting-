<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>טייזון – היועץ העסקי שלך</title>
</head>
<body>
<style>
:root{--on-pri:#fff;--bg:#f5f7fb;--card:#fff;--ink:#1c2433;--mut:#667085;--line:#e3e8f0;--pri:#8a6429;--ok:#3f8a14;--bad:#dc2626;--warn:#d97706}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1420;--card:#171e2e;--ink:#e8ecf4;--mut:#93a0b8;--line:#2a3550;--pri:#d4b06a;--on-pri:#1a1408;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1420;--card:#171e2e;--ink:#e8ecf4;--mut:#93a0b8;--line:#2a3550;--pri:#d4b06a;--on-pri:#1a1408;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Arial,sans-serif}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-size:18px}
.logo{height:44px;width:auto;background:#fff;border-radius:10px;padding:3px 8px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1;align-items:center}
nav a{padding:6px 12px;border-radius:8px;color:var(--mut);text-decoration:none}
nav a.on{background:var(--pri);color:var(--on-pri)}
main{max-width:1100px;margin:0 auto;padding:16px}
td,th{min-width:0}
h1{font-size:22px;margin:4px 0 16px}h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:24px}.stat span{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse}
th,td{text-align:right;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:13px}
.scroll{overflow-x:auto}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
button.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
button.sm{padding:2px 8px;font-size:13px}
button.del{color:var(--bad)}
.bar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--line);color:var(--ink)}
.tag.ok{background:#dcfce7;color:#166534}.tag.bad{background:#fee2e2;color:#991b1b}.tag.warn{background:#fef3c7;color:#92400e}
.muted{color:var(--mut)}.empty{color:var(--mut);padding:20px;text-align:center}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(520px,94vw);padding:18px}
dialog::backdrop{background:#0006}
label{display:block;margin:8px 0 2px;font-size:13px;color:var(--mut)}
input,select,textarea{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:70px}
.row{display:flex;gap:8px;justify-content:flex-start;margin-top:14px}
.q{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.q select{width:90px}
.meter{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--pri)}
.swot{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
svg{max-width:100%;height:auto}
@media print{.top,.no-print,button{display:none!important}body{background:#fff;color:#000}.card{border-color:#999;break-inside:avoid}}
.who{margin-inline-start:auto;display:flex;gap:8px;align-items:center;color:var(--mut);font-size:13px}
.login{max-width:420px;margin:40px auto}.err{min-height:1.2em;margin:8px 0 0;font-size:14px}
.tour-ring{position:fixed;z-index:50;border-radius:10px;pointer-events:none;box-shadow:0 0 0 9999px rgba(10,14,24,.55),0 0 0 3px var(--pri);transition:all .2s}
.tour-pop{position:fixed;z-index:60;width:min(340px,calc(100vw - 16px));background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tour-pop.center{top:50%;left:50%;transform:translate(-50%,-50%)}
.tour-pop h3{margin:2px 0 6px;font-size:17px}.tour-pop p{margin:0 0 10px;line-height:1.55}
.tour-step{font-size:12px;color:var(--mut)}
.tour-bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:10px}.tour-bar i{display:block;height:100%;background:var(--pri)}
.tour-pop .row{margin-top:0;flex-wrap:wrap}.tour-x{margin-inline-start:auto;border:0;background:none;color:var(--mut);text-decoration:underline}
@media(prefers-reduced-motion:reduce){.tour-ring{transition:none}}
.handle{width:44px;text-align:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--mut);font-size:18px;line-height:1}
.handle:hover{color:var(--pri)}
.rank{width:34px;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}
tr.dragging{background:var(--bg);box-shadow:0 4px 14px rgba(0,0,0,.25);position:relative;z-index:2;cursor:grabbing}
tr.dragging .handle{cursor:grabbing;color:var(--pri)}
.pwrap{position:relative}.pwrap input{padding-right:44px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;padding:6px 8px;color:var(--mut);display:flex;align-items:center;border-radius:8px;cursor:pointer}
.eye:hover,.eye[aria-pressed=true]{color:var(--pri)}
.eye:focus-visible{outline:2px solid var(--pri)}
#tl{border-collapse:collapse}
#tl tbody{border-bottom:1px solid var(--line)}
#tl tbody>tr>td{border-bottom:0}
tbody.dragging tr{background:var(--bg);box-shadow:0 4px 14px rgba(0,0,0,.25);position:relative;z-index:2;cursor:grabbing}
.drag-tasks .subrow{display:none}
.subrow>td{padding-top:0}
.subtable{border-inline-start:3px solid var(--line);margin:0 0 4px;background:color-mix(in srgb,var(--bg) 60%,transparent)}
.subtable td{padding:5px 8px;font-size:15px}
.subbar{margin:4px 0 6px}
.fold{border:0;background:none;color:var(--mut);padding:0 4px;cursor:pointer;font-size:14px}
tr.dragging{background:var(--bg)}

tbody[data-open] tr.trow,tr[data-sub][data-open]{cursor:grab}
.dragging-now,.dragging-now *{user-select:none!important;-webkit-user-select:none!important;cursor:grabbing!important}
.savebanner{position:sticky;top:0;z-index:100;background:#b91c1c;color:#fff;padding:8px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px}
.savebanner button{background:#fff;color:#7f1d1d;border-color:#fff}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.chip{display:inline-flex;align-items:center;gap:6px;margin:0;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:var(--bg);color:var(--ink);font-size:15px;cursor:pointer}
.chip input{width:auto;margin:0}
.chip:has(input:checked){border-color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,var(--card));color:var(--ink)}
.chip:focus-within{outline:2px solid var(--pri)}
.rate{display:flex;align-items:center;gap:10px}.rate input{width:150px;padding:0}.rate output{width:1.2em;text-align:center;font-weight:600}
.wiz{max-width:640px}.wiz .q{flex-wrap:wrap}
input,select,textarea,progress{accent-color:var(--pri)}
.searchbar{margin-bottom:10px}.searchbar input{max-width:420px}
mark{background:#f3dfb0;background:color-mix(in srgb,var(--pri) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.grid2,.grid3{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.hint{margin:0 0 4px;min-height:0;font-size:13px;color:var(--warn)}
.kv{display:flex;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line);align-items:baseline;flex-wrap:wrap}.kv>span:first-child{min-width:110px}
.more{list-style:none;padding:0;margin:0}.more li{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}.more li button{flex:none}
.details summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline}.details summary h2{margin:0}.details[open] summary{margin-bottom:8px}.details summary::-webkit-details-marker{display:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.linkbox{display:flex;gap:8px}.linkbox input{flex:1;min-width:0}
a.btn{display:inline-block;text-decoration:none}a.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.wizwrap{max-width:680px;margin:0 auto}
.wsec{border:0;margin:0;padding:0 0 14px;min-width:0}.wsec+.wsec{border-top:1px solid var(--line);padding-top:14px}
.wsec legend{padding:0;margin-bottom:8px;font-weight:600;font-size:15px;color:var(--ink)}
.fld{min-width:0;margin-bottom:8px}.fld label{margin-top:0}
.grid2,.grid3{gap:0 12px}
.rolecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rolecard{position:relative;display:flex;flex-direction:column;gap:2px;margin:0;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;transition:border-color .15s,background .15s}
.rolecard input{position:absolute;opacity:0;pointer-events:none}
.rolecard .rc-t{font-weight:600;font-size:16px;color:var(--ink)}.rolecard .rc-d{font-size:13px;color:var(--mut)}
.rolecard:hover{border-color:var(--pri)}
.rolecard.on{border-color:var(--pri);background:#f6efe3;background:color-mix(in srgb,var(--pri) 12%,var(--card));box-shadow:inset 0 0 0 1px var(--pri)}
.rolecard:focus-within{outline:2px solid var(--pri);outline-offset:2px}
.wsec>legend{float:right;width:100%}.wsec>legend+*{clear:both}
@media(max-width:520px){.rolecards{grid-template-columns:1fr}.rolecard{flex-direction:row;align-items:baseline;gap:8px;padding:10px 12px}}
.wsec legend .lsub{font-weight:400;font-size:13px}
.wsec .chips{margin-top:0}.wsec .fld+.fld{margin-top:0}
.wsec .q:last-child{border-bottom:0}
.techrow{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--line)}
.techrow:last-child{border-bottom:0}
.tr-name{display:flex;flex-direction:column;min-width:0;flex:1 1 180px}.tr-name .muted{font-size:13px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.seg label{margin:0;padding:6px 10px;font-size:13px;color:var(--ink);cursor:pointer;border-inline-start:1px solid var(--line);white-space:nowrap}
.seg label:first-child{border-inline-start:0}
.seg label input{position:absolute;opacity:0;pointer-events:none}
.seg label.on{background:var(--pri);color:var(--on-pri)}
.seg label:focus-within{outline:2px solid var(--pri);outline-offset:-2px}
@media(max-width:520px){.seg{width:100%}.seg label{flex:1;text-align:center;padding:6px 4px}}
.seg label input,.rolecard input{width:1px;height:1px;margin:0;padding:0}
.cgroup{margin-bottom:6px}.cg-t{font-size:13px;font-weight:600;color:var(--pri);margin:4px 0 4px}
.cgroup .chips{margin:0}.cgroup .hint{display:none}
/* שליחת התוכנית ללקוח */
.sendopts{display:grid;gap:8px;margin:12px 0}
.sendopts button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;padding:10px 14px;width:100%}
.sendopts button span{font-size:13px;font-weight:400;opacity:.85}
.sendopts button:disabled{opacity:.5;cursor:not-allowed}
#printReport{display:none}
@media print{
  body.rp-on>*:not(#printReport){display:none!important}
  body.rp-on #printReport{display:block;color:#111;font-size:12.5pt;line-height:1.55}
  body.rp-on{background:#fff!important}
  @page{margin:16mm 14mm}
}
#printReport .rp-head{display:flex;align-items:center;gap:12px;border-bottom:2px solid #8a6429;padding-bottom:10px;margin-bottom:14px}
#printReport .rp-head img{height:54px}
#printReport .rp-head div{display:flex;flex-direction:column}#printReport .rp-head b{font-size:15pt;color:#8a6429}#printReport .rp-head span{color:#555}
#printReport h1{margin:0 0 2px;font-size:22pt}#printReport .rp-sub{color:#555;margin:0 0 14px}
#printReport section{margin-bottom:14px}#printReport h2,#printReport h3{break-after:avoid}
#printReport h2{color:#8a6429;font-size:15pt;margin:14px 0 6px;border-bottom:1px solid #e3d6bf;padding-bottom:3px}
#printReport h3{font-size:12.5pt;margin:12px 0 4px}#printReport h3 span{font-weight:400;color:#666}
#printReport li{margin-bottom:5px;break-inside:avoid}#printReport .rp-why{color:#555;font-size:11pt}
#printReport .rp-sk{border-collapse:collapse;width:100%;max-width:520px}#printReport .rp-sk td{padding:3px 6px;border:0}
#printReport .rp-bar{display:block;width:220px;height:9px;background:#eee;border-radius:5px;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printReport .rp-bar i{display:block;height:100%;background:#8a6429;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printReport .rp-foot{margin-top:18px;color:#777;font-size:10pt;border-top:1px solid #ddd;padding-top:6px}
#roleOtherBox{margin-top:10px}

  /* כניסה עם שם משתמש: Firebase מזהה לפי מייל, ולכן שם משתמש ממופה לכתובת פנימית שאינה נשלחת לשום מקום (.invalid) */
  const UDOM = '@username.invalid';

    'auth/popup-closed-by-user': 'החלון נסגר לפני סיום ההתחברות',

  let knownAt = 0; // updatedAt של הגרסה האחרונה שהסשן הזה ראה או כתב: עדכון ישן מהשרת לא יידרוס שינויים מקומיים

  let reqUnsub = null; const quoteUnsubs = new Map(); const quotes = new Map(); let requests = [];

  function stopMarket() {
    reqUnsub?.(); reqUnsub = null;

  }

  window.Cloud = {

    signUp(id, pw) { const r = toEmail(id); return r.error ? Promise.resolve({ ok: false, error: r.error }) : wrap(auth.createUserWithEmailAndPassword(r.email, pw)); },
    google: () => wrap(auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())),
    reset(id) {
      if (!(id || '').includes('@')) return Promise.resolve({ ok: false, error: 'איפוס במייל זמין רק למי שנרשם עם מייל. למשתמש עם שם משתמש יש לבקש מהמנהל לאפס את הסיסמה.' });

    },
    signOut: async () => { await window.Cloud.flush(); stopMarket(); intakeUnsub?.(); intakeUnsub = null; wsUnsub?.(); wsUnsub = null; return auth.signOut(); },

    async loadWorkspace(uid) {
      const snap = await wsRef(uid).get();
      window.Cloud.loadedAt = snap.exists ? (snap.data().updatedAt || 0) : 0; // לשחזור שינויים מקומיים שלא הגיעו לענן

      return snap.exists ? JSON.parse(snap.data().json || '{}') : null;
    },
    /* מנהל: מסמך admins/{uid} שנוצר ידנית בקונסולה. הלקוח לא יכול ליצור אותו (ראה firestore.rules) */

      try { await db.collection('workspaces').limit(1).get(); return true; } catch { return false; } // השאילתה על כל האוסף מותרת רק למנהל
    },
    /* מנהל: כל סביבות העבודה, לקריאה בלבד */
    async listWorkspaces() {

    },
    stopMarket,
    /* ----- שאלון ללקוחות (בלי התחברות): publicForms/{uid} ציבורי לקריאה, intakes/{id} פתוח רק ליצירה ----- */
    async getPublicForm(uid) {
      try {
        const r = await withTimeout(fetch(`${REST}/publicForms/${encodeURIComponent(uid)}?key=${cfg.apiKey}`), 10000);
        if (r.status === 404) return null;

        const f = (await r.json()).fields || {};
        return { enabled: !!(f.enabled && f.enabled.booleanValue), bookingUrl: (f.bookingUrl && f.bookingUrl.stringValue) || '', title: (f.title && f.title.stringValue) || '' };
      } catch {
        try { const s = await withTimeout(db.collection('publicForms').doc(uid).get(), 8000); return s.exists ? s.data() : null; } catch (e) { return { error: msg(e) }; }

      try {
        const r = await withTimeout(fetch(`${REST}/intakes?key=${cfg.apiKey}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ fields: { ownerUid: { stringValue: ownerUid }, answers: { stringValue: json }, createdAt: { integerValue: String(now) }, v: { integerValue: '1' } } }) }), 15000);
        if (r.ok) return { ok: true };
        if (r.status === 403) return { ok: false, error: 'השאלון אינו פתוח כרגע לקבלת תשובות' };
        throw new Error('http ' + r.status);
      } catch {
        return wrap(withTimeout(db.collection('intakes').add({ ownerUid, answers: json, createdAt: now, v: 1 }), 15000));
      }
    },
    longPoll,
    enableCompat() { try { localStorage.setItem(LP_KEY, '1'); } catch { /* ignore */ } },
    withTimeout,
    watchIntakes(uid, cb) {
      intakeUnsub?.();
      intakeUnsub = db.collection('intakes').where('ownerUid', '==', uid).onSnapshot((s) => cb(s.docs.map((d) => ({ id: d.id, ...d.data() }))), () => {});
    },
    deleteIntake: (id) => wrap(db.collection('intakes').doc(id).delete()),
    createRequest: (user, r) => wrap(db.collection('requests').add({
      ownerUid: user.uid, ownerName: user.name, title: r.title, area: r.area, budget: r.budget, desc: r.desc,

    })),
    async deleteRequest(id) {
      return wrap((async () => {
        const ref = db.collection('requests').doc(id);
        const qs = await ref.collection('quotes').get();
        await Promise.all(qs.docs.map((d) => d.ref.delete()));

/* מיון המשימות הפתוחות: הסדר החדש נשמר כסדר העדיפות (אפשר להמשיך לגרור). ריקים (בלי תאריך/פרויקט) תמיד בסוף. */
const cmpEmptyLast = (x, y, f) => (x ? (y ? f(x, y) : -1) : (y ? 1 : 0));
const cmpDue = (a, b, dir) => cmpEmptyLast(a.due, b.due, (x, y) => dir * x.localeCompare(y));

const TASK_SORTS = {

  project: (a, b) => cmpEmptyLast(a.project && projectName(a.project), b.project && projectName(b.project), (x, y) => x.localeCompare(y, 'he')) || cmpDue(a, b, 1),
  title: (a, b) => a.title.localeCompare(b.title, 'he'),

function forecast(p) {
  const rows = []; let cash = p.cash; let be = null; let runway = null;

    const rev = p.revenue * Math.pow(1 + p.growth / 100, m - 1);
    const gross = rev * (1 - p.cogs / 100); const net = gross - p.fixed;
    cash += net; rows.push({ m, rev, gross, net, cash });
    if (be === null && net >= 0) be = m;
    if (runway === null && cash < 0) runway = m;
  }
  return { rows, be, runway };
}

  <div class="grid">${stat(be ? 'חודש ' + be : 'לא בטווח', 'נקודת איזון תפעולית')}${stat(runway ? 'חודש ' + runway : 'אין גירעון', 'המזומן נגמר')}${stat(money(last.cash), 'מזומן בסוף התקופה')}${stat(money(rows.reduce((a, r) => a + r.net, 0)), 'רווח מצטבר')}</div>

/* תשובות שמגיעות מבחוץ: רק מפתחות פשוטים, מחרוזות קצרות ורשימות קצרות */
function cleanAnswers(src) {
  const out = {}; let n = 0;
  for (const [k, v] of Object.entries(src || {})) {
    if (k === 'website' || !/^[A-Za-z_]{1,30}$/.test(k) || ++n > 90) continue;
    if (typeof v === 'string' || typeof v === 'number') out[k] = String(v).slice(0, 600);
    else if (Array.isArray(v)) out[k] = v.filter((x) => typeof x === 'string').slice(0, 20).map((x) => x.slice(0, 120));
  }
  if (!P_ROLES[out.role]) out.role = 'founder';
  out.name = (out.name || '').trim().slice(0, 80) || 'לקוח/ה ללא שם';
  return out;
}

  <div class="tour-bar"><i style="width:${Math.round(((tour.i + 1) / n) * 100)}%"></i></div>
  <div class="row">${st.done ? '<button data-do="tourNext">דלג על השלב</button>' : `<button class="pri" data-do="tourNext">${st.last ? 'סיום' : tour.i === 0 ? 'בוא נתחיל' : 'הבא'}</button>`}
  ${tour.i > 0 ? '<button data-do="tourBack">הקודם</button>' : ''}<button class="tour-x" data-do="tourFinish">${st.last ? '' : 'יציאה'}</button></div>`;
  document.body.append(pop);
  if (el) {
    el.scrollIntoView({ block: 'center', behavior: 'instant' });
    const r = el.getBoundingClientRect(); const ring = document.createElement('div');
    ring.className = 'tour-ring'; Object.assign(ring.style, { top: r.top - 6 + 'px', left: r.left - 6 + 'px', width: r.width + 12 + 'px', height: r.height + 12 + 'px' });
    document.body.append(ring);
    const pr = pop.getBoundingClientRect(); const below = r.bottom + 12 + pr.height < innerHeight;
    pop.style.top = Math.max(8, below ? r.bottom + 12 : r.top - 12 - pr.height) + 'px';
    pop.style.left = Math.min(innerWidth - pr.width - 8, Math.max(8, r.left + r.width / 2 - pr.width / 2)) + 'px';
  } else { pop.classList.add('center'); }
  pop.querySelector('button.pri, button')?.focus({ preventScroll: true });
}
let tourAutoTried = false;
addEventListener('resize', () => { if (tour) tourRender(); });
addEventListener('keydown', (e) => { if (tour && e.key === 'Escape' && !$('#dlg').open) tourFinish(); });
$('#dlg').addEventListener('close', () => { if (tour) tourRender(); });

/* ---------- הפעלה ---------- */
if (Cloud.enabled) {
  loadStart = Date.now();
  window.addEventListener('pagehide', () => Cloud.flush());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Cloud.flush(); }); // מעבר לטאב אחר או נעילת מסך
  Cloud.init(async (user) => {
    if (!user) { me = null; wsLoaded = false; loadError = ''; pubOwn = undefined; isAdmin = false; adminData = null; adminUser = null; S = empty(); M = []; tour = null; tourAutoTried = false; Cloud.stopMarket(); loading = false; return render(); }
    me = user; wsLoaded = false; loadError = ''; loading = true; loadStart = Date.now(); isAdmin = false; adminData = null; adminUser = null; render();
    let data;
    try {
      data = await Cloud.withTimeout(Cloud.loadWorkspace(user.uid), 12000);
    } catch (e) {
      // אין גישה לשרת: לא פותחים אפליקציה ריקה (שמירה ממנה הייתה דורסת את הנתונים בענן)
      const conn = e.code === 'timeout' || e.code === 'unavailable' || /offline|network|unavailable/i.test(e.message || '');
      if (conn && !Cloud.longPoll && !sessionStorage.getItem('tizon-compat-tried')) { sessionStorage.setItem('tizon-compat-tried', '1'); Cloud.enableCompat(); location.reload(); return; }
      loadError = conn ? 'אין חיבור לשרת הנתונים' : 'שגיאה בטעינת הנתונים: ' + (e.message || e);
      loading = false; return render();
    }
    wsLoaded = true; // מכאן מותר לשמור
    if (!data) { // כניסה ראשונה: מעבירים נתונים שנשמרו מקומית בדפדפן הזה, אם יש
      data = readLocal() || {};
      if (Object.keys(data).length) { S = Object.assign(empty(), data); save(); try { localStorage.removeItem(KEY); } catch { /* ignore */ } }
    }
    S = Object.assign(empty(), data);
    const pend = readPend(user.uid); // שינויים שנעשו ולא הספיקו להישמר (רענון או סגירה מהירה, או רשת שנפלה)
    if (pend && pend.ts > (Cloud.loadedAt || 0)) {
      S = Object.assign(empty(), pend.data); save();
      setTimeout(() => note('שוחזרו שינויים אחרונים שלא הספיקו להישמר בענן לפני שהדף נסגר, והם נשמרים עכשיו.'), 300);
    } else if (pend) { try { localStorage.removeItem(PEND + user.uid); } catch { /* ignore */ } }
    isAdmin = await Cloud.withTimeout(Cloud.isAdmin(user.uid), 8000).catch(() => false);
    Cloud.watchWorkspace(user.uid, (remote) => { S = Object.assign(empty(), remote); render(); });
    Cloud.watchRequests(user.uid, (list) => { M = list; if (location.hash === '#market') render(); });
    Cloud.watchIntakes(user.uid, importIntakes); // שאלונים מלקוחות נכנסים אוטומטית
    loading = false; render();
  });
}
render();

</script>
